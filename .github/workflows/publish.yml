name: Publish to npm

"on":
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: mbologna/.github/.github/workflows/npm-publish.yml@cebe9d284cbd32e96ada3b8b37e0537a4ab3ddaf # main
    with:
      node_version: lts/*
      package_manager: npm
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
