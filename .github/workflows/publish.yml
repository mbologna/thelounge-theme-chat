name: Publish to npm

"on":
  release:
    types: [published]
  # auto-release (ci.yml) starts it on the new tag this way.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: mbologna/.github/.github/workflows/npm-publish.yml@b85a51a50cc1e566534b425c3275095a1b7fb58a # main
    with:
      node_version: lts/*
      package_manager: npm
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
