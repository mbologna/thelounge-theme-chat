name: Publish to npm

"on":
  release:
    types: [published]
  # auto-release (ci.yml) starts it on the new tag this way.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: mbologna/.github/.github/workflows/npm-publish.yml@8f27b292381a0288ffea3cbfda2f325819bf7262 # main
    with:
      node_version: lts/*
      package_manager: npm
