name: Publish to npm

"on":
  release:
    types: [published]
  # auto-release (ci.yml) starts it on the new tag this way.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: mbologna/.github/.github/workflows/npm-publish.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      node_version: lts/*
      package_manager: npm
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
