name: Publish to npm

"on":
  release:
    types: [published]
  # auto-release (ci.yml) starts it on the new tag this way.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: mbologna/.github/.github/workflows/npm-publish.yml@4ab7563caf5d7d861f5275163417627e38eecc0e # main
    with:
      node_version: lts/*
      package_manager: npm
