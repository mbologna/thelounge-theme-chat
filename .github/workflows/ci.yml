name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  ci:
    uses: mbologna/.github/.github/workflows/node-ci.yml@2f98255e6e61d77faf37b5f6fb84208682cb5ff2 # main
    with:
      node_version: lts/*
      package_manager: npm
      test_command: "check"
      enable_audit: true
      audit_omit_dev: true
      enable_release_drafter: true

  auto-release:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/auto-release.yml@2f98255e6e61d77faf37b5f6fb84208682cb5ff2 # main
    with:
      strategy: commits
    secrets: inherit
